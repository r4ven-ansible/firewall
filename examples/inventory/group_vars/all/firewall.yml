  #     ct:
  #       state: new
  #   action:
  #     jump: log_drop

  # ---- FORWARD ----
  fwd_drop_invalid:
    order: 200
    family: inet
    table: filter
    chain: forward
    match:
      ct:
        state: invalid
    action: drop
    comment: "Drop invalid forwarded connections"

  # spoofing guard must run before fwd_allow_established
  fwd_drop_wan_spoofed_lan_ipv4:
    order: 201
    family: inet
    table: filter
    chain: forward
    expr: 'iifname "{{ nft_wan_interface }}" ip saddr @lan4'
    action:
      jump: log_drop
    comment: "Drop spoofed private IPv4 forwarded from WAN"

  fwd_drop_wan_spoofed_lan_ipv6:
    order: 202
    family: inet
    table: filter
    chain: forward
    expr: 'iifname "{{ nft_wan_interface }}" ip6 saddr @lan6'
    action:
      jump: log_drop
    comment: "Drop spoofed private IPv6 forwarded from WAN"

  fwd_allow_established:
    order: 205
    family: inet
    table: filter
    chain: forward
    match:
      ct:
        state: [established, related]
    action: accept
    comment: "Allow established forwarded connections"

