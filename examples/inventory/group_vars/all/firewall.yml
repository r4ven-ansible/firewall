  #     ct:
  #       state: new
  #   action:
  #     jump: log_drop

  # ---- FORWARD ----
  fwd_drop_invalid:
    order: 200
    family: inet
    table: filter
    chain: forward
    match:
      ct:
        state: invalid
    action: drop
    comment: "Drop invalid forwarded connections"

  fwd_allow_established:
    order: 203
    family: inet
    table: filter
    chain: forward
    match:
      ct:
        state: [established, related]
    action: accept
    comment: "Allow established forwarded connections"

  # After fwd_allow_established, for the same reason as in the input chain.
  fwd_drop_wan_spoofed_lan_ipv4:
    order: 205
    family: inet
    table: filter
    chain: forward
    expr: 'iifname "{{ nft_wan_interface }}" ip saddr @lan4 ip saddr != @wan_local4'
    action:
      jump: log_drop
    comment: "Drop spoofed private IPv4 forwarded from WAN"

  fwd_drop_wan_spoofed_lan_ipv6:
    order: 206
    family: inet
    table: filter
    chain: forward
    expr: 'iifname "{{ nft_wan_interface }}" ip6 saddr @lan6 ip6 saddr != @wan_local6'
    action:
      jump: log_drop
    comment: "Drop spoofed private IPv6 forwarded from WAN"

