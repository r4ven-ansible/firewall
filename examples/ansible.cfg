[defaults]
inventory = ./inventory/hosts.yml
roles_path = ../..
# No global hash_behaviour: host-level rules go through nft_rules_host, which
# the role merges after nft_rules_extra. Set "hash_behaviour = merge" yourself
# only if you must define the same dictionary at two inventory levels.
host_key_checking = True
interpreter_python = auto_silent
retry_files_enabled = False
timeout = 30

# Human-readable output without external callback collections.
stdout_callback = ansible.builtin.default
callback_result_format = yaml
callback_format_pretty = True
bin_ansible_callbacks = True
nocolor = False

# A firewall change can blackhole the control connection. Without keepalives
# Ansible blocks on the dead TCP session instead of failing, and by the time it
# recovers the rollback timer has already restored the host, which turns a clear
# failure into a confusing one. ConnectTimeout bounds the reconnect attempts.
[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=5 -o ServerAliveCountMax=3 -o ConnectTimeout=10

[privilege_escalation]
become = True
become_method = sudo
become_user = root
