---

firewall_supported_distributions:
  - Debian
  - LMDE

firewall_enabled: false

nft_remove_other_firewall: false
nft_flush_ruleset: false
nft_restart_docker: false
nft_packages:
  - nftables
nft_apt_update_cache: true
nft_apt_cache_valid_time: 3600
nft_bin: /usr/sbin/nft
nft_config_path: /etc/nftables.conf
nft_backup_path: /root/nft_backup
nft_backup_keep: 10
nft_validate_cmd: "{{ nft_bin }} -c -f %s"
nft_wan_interface: >-
  {{ ansible_default_ipv4.interface
     | default(ansible_default_ipv6.interface | default('unknown0', true), true) }}

# Rollback safety net: a transient systemd timer restores the previous
# runtime ruleset, config (including absence), and service enablement/mask
# unless a locked commit wins before rollback. Armed only with the SSH check.
nft_rollback_unit: nft-rollback
nft_rollback_timeout: 120

# The check connects to the target's SSH port from nft_ssh_check_delegate.
# With ProxyJump/bastion setups the control node may have no direct
# access: point nft_ssh_check_delegate at the bastion (it needs direct
# reachability to the target) or set nft_ssh_check_enabled: false.
nft_ssh_check_enabled: true
nft_ssh_check_delegate: localhost
nft_ssh_check_host: "{{ ansible_host | default(inventory_hostname) }}"
nft_ssh_check_port: "{{ ssh_port | default(22) }}"
nft_ssh_check_timeout: 30

nft_tables: []
nft_sets: []
nft_maps: []
nft_flowtables: []
nft_chains: []
nft_rules: {}
nft_allowed_ports: []
nft_allowed_ports_exclude_ssh: true
nft_rules_extra: {}

