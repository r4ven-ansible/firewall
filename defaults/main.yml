#   # Change only action
#   wan_allow_http_https:
#     action: drop


# =========================
# nftables DSL (cheat sheet)
# =========================

# match → фильтр пакета
# action → что с ним делать
# order → когда применять

# rule:
#   order: int              # порядок выполнения
#   family: inet|ip|ip6     # семейство
#   table: filter|nat       # таблица
#   chain: input|forward|output|custom

#   match:                  # УСЛОВИЯ (фильтрация пакета)
#     ct:                   # connection tracking
#       state: [new, established, related, invalid]
#       status: dnat

#     meta:
#       l4proto: tcp|udp|icmp
#       mark: int

#     ip:                   # IPv4
#       saddr: { value: "@set", op: "!=" }   # @set / IP / CIDR
#       daddr: { value: "1.2.3.4", op: "=" }

#     ip6:                  # IPv6
#       saddr: "@set"

#     tcp:
#       dport: 22
#       sport: [1024-65535]
#       flags: syn                       # tcp flags syn
#       # для битовых масок используйте raw:
#       # raw: 'tcp flags & (syn|ack) == syn'

#     udp:
#       dport: [53, 123]

#     icmp:
#       type: [echo-request, destination-unreachable]

#     icmpv6:
