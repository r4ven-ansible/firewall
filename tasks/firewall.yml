---

- name: Disable other firewall
  tags: [firewall, nft_other_firewall]
  when: nft_remove_other_firewall | bool
  block:
    - name: Disable other firewall
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
        daemon_reload: true
      failed_when: false
      loop:
        - firewalld
        - ufw
        - iptables
        - netfilter-persistent

    - name: Ensure other firewall is uninstalled
      ansible.builtin.apt:
        name:
          - "firewalld"
          - "ufw"
        state: absent
      retries: 3

- name: Ensure nftables is installed
  ansible.builtin.apt:
    name: "{{ nft_packages }}"
    state: present
    update_cache: "{{ nft_apt_update_cache }}"
    cache_valid_time: "{{ nft_apt_update_cache | bool | ternary(nft_apt_cache_valid_time, omit) }}"
  retries: 3
  when: not ansible_check_mode
  tags: [firewall, nft_packages]


- name: Prepare nftables ruleset
  tags: [firewall, nft_rules, nft_config, nft_apply]
  block:
    - name: Protect the management path before rendering rules
      ansible.builtin.import_tasks: preflight.yml

    - name: Initialize allowed port rules
      ansible.builtin.set_fact:
        nft_allowed_port_rules: {}
        nft_allowed_tcp_ports: []
        nft_allowed_udp_ports: []

    - name: Collect allowed TCP ports
      ansible.builtin.set_fact:
        nft_allowed_tcp_ports: "{{ nft_allowed_tcp_ports + [(item | string).split('/')[0]] }}"
      loop: "{{ nft_allowed_ports }}"
      when:
        - nft_allowed_ports | length > 0
        - (item | string).split('/') | length == 1 or (item | string).split('/')[1] == 'tcp'
        - >
          not nft_allowed_ports_exclude_ssh | bool
          or ((item | string).split('/')[0])
          != (ssh_port | default('22') | string)

    - name: Collect allowed UDP ports
      ansible.builtin.set_fact:
        nft_allowed_udp_ports: "{{ nft_allowed_udp_ports + [(item | string).split('/')[0]] }}"
      loop: "{{ nft_allowed_ports }}"
      when:
        - nft_allowed_ports | length > 0
        - (item | string).split('/') | length > 1
        - (item | string).split('/')[1] == 'udp'

    - name: Build grouped allowed port rules
      ansible.builtin.set_fact:
        nft_allowed_port_rules: >-
          {{
            {}
            | combine(
              (nft_allowed_tcp_ports | length > 0)
              | ternary({
                'wan_allow_tcp_ports': {
                  'order': 111,
                  'family': 'inet',
                  'table': 'filter',
                  'chain': 'input_wan',
                  'match': {
                    'tcp': {
                      'dport': nft_allowed_tcp_ports
                    }
                  },
                  'action': 'accept',
                  'comment': 'Allow TCP ports from WAN'
                }
              }, {}),
              recursive=True
            )
            | combine(
              (nft_allowed_udp_ports | length > 0)
              | ternary({
                'wan_allow_udp_ports': {
                  'order': 112,
                  'family': 'inet',
                  'table': 'filter',
                  'chain': 'input_wan',
                  'match': {
                    'udp': {
                      'dport': nft_allowed_udp_ports
                    }
                  },
                  'action': 'accept',
                  'comment': 'Allow UDP ports from WAN'
                }
              }, {}),
              recursive=True
            )
          }}
      when: nft_allowed_ports | length > 0

    # The management rule is merged first, so an explicit override or null in
    # nft_rules_extra/nft_rules_host still wins over the autodetected one.
    - name: Merge nftables rules dictionaries
      ansible.builtin.set_fact:
        nft_rules_final: >-
          {{
            nft_rules
            | combine(nft_mgmt_rules, recursive=True)
            | combine(nft_allowed_port_rules, recursive=True)
            | combine(nft_rules_extra, recursive=True)
            | combine(nft_rules_host, recursive=True)
          }}

    - name: Remove null rules
      ansible.builtin.set_fact:
        nft_rules_final: "{{ nft_rules_final | dict2items | rejectattr('value', 'none') | items2dict }}"

    - name: Collect other rule orders in the management chain
      ansible.builtin.set_fact:
        nft_mgmt_other_orders: >-
          {{ nft_rules_final | dict2items
             | rejectattr('key', 'equalto', nft_mgmt_rule_name)
             | selectattr('value.family', 'defined')
             | selectattr('value.table', 'defined')
             | selectattr('value.chain', 'defined')
             | selectattr('value.family', 'equalto', nft_mgmt_family)
             | selectattr('value.table', 'equalto', nft_mgmt_table)
             | selectattr('value.chain', 'equalto', nft_mgmt_chain)
             | map(attribute='value.order') | map('int') | list }}
      when: nft_mgmt_rule_name in nft_rules_final

    - name: Keep the management allow rule ahead of every rule in its chain
      ansible.builtin.assert:
        that:
          - nft_mgmt_other_orders | length == 0
            or (nft_rules_final[nft_mgmt_rule_name].order | int) < (nft_mgmt_other_orders | min)
        fail_msg: >-
          {{ nft_mgmt_rule_name }} has order
          {{ nft_rules_final[nft_mgmt_rule_name].order }}, which is not ahead of
          every rule in {{ nft_mgmt_family }}/{{ nft_mgmt_table }}/{{ nft_mgmt_chain }}
          (lowest other order: {{ nft_mgmt_other_orders | min }}). An earlier
          drop or jump could cut the connection that is applying the rules.
          Lower nft_mgmt_order.
        quiet: true
      when: nft_mgmt_rule_name in nft_rules_final


- name: Apply nftables transaction
  ansible.builtin.import_tasks: apply.yml
  tags: [firewall, nft_config, nft_apply]

# Started as well as enabled: otherwise the committed rules live only in the
# kernel, and the unit state says nothing about whether they were ever loaded.
- name: Enable nftables
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    masked: false
    state: started
  when: "not ansible_check_mode or (nft_binary | default({'stat': {'exists': false}})).stat.exists"
  tags: [firewall, nft_systemd, nft_apply]

# Recorded after the service start, so the baseline is the state the host will
# actually boot with, not the one that existed mid-transaction. Only written
# when this run owns that state: blessing a drifted ruleset would disable the
# detector instead of reporting it.
- name: Record the runtime drift baseline
  ansible.builtin.command:
    argv: ["{{ nft_state_dir }}/fingerprint", store]
  changed_when: false
  when:
    - nft_drift_check_enabled | bool
    - not ansible_check_mode
    - "(nft_binary | default({'stat': {'exists': false}})).stat.exists"
    - (nft_apply_required | default(false) | bool) or (nft_fingerprint.stdout | default('') == 'unknown')
  tags: [firewall, nft_config, nft_apply]

# Kept non-fatal so a host where Docker is not installed yet still converges,
# but a failure is reported: with nft_flush_ruleset the container rules are gone
# until the daemon reprograms them, and silence would hide that.
# ignore_errors, not failed_when: false - the latter rewrites the result to
# failed: false, so nothing downstream can tell that the restart failed.
- name: Restart docker
  ansible.builtin.systemd_service:
    name: docker
    state: restarted
  ignore_errors: true
  register: nft_docker_restart
  when:
    - nft_restart_docker | bool
    - nft_config_copied.changed | default(false)
  tags: [firewall, nft_docker]

- name: Report a failed docker restart
  ansible.builtin.debug:
    msg: >-
      Restarting docker failed ({{ nft_docker_restart.msg | default('no message') }}).
      Any rules the daemon owns, including published container ports, stay
      missing until it is restarted successfully.
  when: nft_docker_restart is defined and nft_docker_restart is failed
  tags: [firewall, nft_docker]
